name: preview

# Plan morning-digest § 3 and § 4. Saves /digest/2026-10-28 as one HTML file and deploys it to
# GitHub Pages, so the preview never lands in a commit (ADR 0003). Runs only by hand.
# The banner shows the LANE_MARKER secret. Delete the secret and run again for the § 4 clean-up:
# the banner then reads "no marker set", on the same link.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Save the page
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
        run: pnpm save-page /digest/2026-10-28 _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v5
